name: publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: go test -count=1 ./backend

      - name: Build self-contained page
        run: python3 scripts/build-page.py --out library.html

      - name: Build Linux amd64 binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w' -o biology-library ./backend

      - name: Package NAS release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/biofolio/build dist/biofolio/private dist/biofolio/data
          cp biology-library dist/biofolio/build/biology-library
          cp library.html dist/biofolio/private/library.html
          cat > dist/biofolio/build/Dockerfile <<'DOCKER'
          FROM alpine:3.21
          RUN apk add --no-cache ca-certificates tzdata libreoffice-writer font-noto-cjk ttf-dejavu \
           && mkdir -p /app && chmod 0755 /app \
           && rm -rf /tmp && ln -s /data/.lo-tmp /tmp \
           && (grep -q '^biofolio:' /etc/passwd || echo 'biofolio:x:1000:10:biofolio:/data/.lo-tmp:/sbin/nologin' >> /etc/passwd) \
           && cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime \
           && echo "Asia/Shanghai" > /etc/timezone
          COPY --chmod=0555 biology-library /biology-library
          COPY --chmod=0444 ../private/library.html /app/library.html
          ENTRYPOINT ["/biology-library"]
          CMD ["--library-page","/private/library.html","--data","/data","--listen","0.0.0.0:18765"]
          DOCKER
          cp library.html dist/biofolio/build/library.html
          sed -i 's|../private/library.html|library.html|' dist/biofolio/build/Dockerfile
          sed -e 's|build: \.|build: ./build|' -e 's|# - ./private:/private:ro|- ./private:/private:ro|' compose.yaml > dist/biofolio/compose.yaml
          cp README.md dist/biofolio/README.md
          tar -C dist -czf biofolio-linux-amd64.tar.gz biofolio

      - name: Upload GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" biofolio-linux-amd64.tar.gz library.html --clobber

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/biofolio
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
