<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>登录 · 生物题库</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fa;--text:#20242b;--muted:#626a77;--line:#bfc7d2;--accent:#2059aa;--btn:#fff;--field:white;--error:#aa2930}
@media(prefers-color-scheme:dark){:root{--bg:#18191c;--text:#eceef3;--muted:#adb4bf;--line:#515660;--accent:#97bcff;--btn:#162135;--field:#25272b;--error:#ffabaf}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:22px clamp(20px,5vw,80px);border-bottom:1px solid var(--line);font-weight:650}header b{display:inline-grid;place-items:center;background:var(--accent);color:var(--btn);border-radius:8px;width:32px;height:32px;margin-right:10px}main{width:min(100% - 40px,380px);margin:clamp(48px,12vh,130px) auto}h1{font-size:32px;margin:0 0 26px}label{display:block;margin:18px 0 5px;font-weight:550}input,button{width:100%;min-height:46px;font:inherit;border-radius:8px}input{padding:8px 12px;color:var(--text);background:var(--field);border:1px solid var(--line)}button{margin-top:24px;border:0;background:var(--accent);color:var(--btn);font-weight:600;cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}[role=alert]{color:var(--error)}
</style><header><b>生</b>生物题库</header><main><h1>登录题库</h1><form method="post" action="/biology/login">
<label for="username">用户名</label><input id="username" name="username" autocomplete="username" autocapitalize="none" required>
<label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<input type="hidden" name="fragment" id="fragment" value="{{.Fragment}}">{{if .Failed}}<p role="alert">用户名或密码不正确，请重新输入。</p>{{end}}<button>登录</button></form></main><script>if(location.hash)document.getElementById('fragment').value=location.hash.slice(1)</script></html>
