<style>
:root{color-scheme:light dark;--bg:#f5f4ef;--box:#fff;--text:#1f2a24;--muted:#67716b;--line:rgba(31,42,36,.13);--fill:rgba(40,58,48,.065);--accent:#2f6b4f;--ink:#fff;--tint:#e8eee3;--error:#b93a28;--shadow:0 1px 2px rgba(31,42,36,.05),0 12px 40px rgba(31,42,36,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121614;--box:#1b201d;--text:#e8ede9;--muted:#9ba69f;--line:rgba(232,237,233,.12);--fill:rgba(232,237,233,.07);--accent:#8fcca7;--ink:#10251a;--tint:#1f2a23;--error:#ff8b76;--shadow:0 0 0 1px rgba(232,237,233,.06)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#121614;--box:#1b201d;--text:#e8ede9;--muted:#9ba69f;--line:rgba(232,237,233,.12);--fill:rgba(232,237,233,.07);--accent:#8fcca7;--ink:#10251a;--tint:#1f2a23;--error:#ff8b76;--shadow:0 0 0 1px rgba(232,237,233,.06)}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 50% -10%,var(--tint),transparent 70%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100%,400px)}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:24px}
.brand img{width:56px;height:56px;border-radius:14px;box-shadow:0 6px 20px rgba(47,107,79,.25)}
.brand h1{margin:16px 0 4px;font-size:28px;font-weight:600;letter-spacing:.02em}
.brand p{margin:0;color:var(--muted);font-size:14px}
form{padding:28px;border-radius:14px;background:var(--box);box-shadow:var(--shadow)}
h2{margin:0 0 4px;font-size:17px;font-weight:600}
form>p{margin:0 0 20px;color:var(--muted);font-size:13px}
label{display:block;margin:16px 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
input{width:100%;min-height:44px;padding:8px 12px;font:inherit;font-size:16px;color:var(--text);background:var(--fill);border:0;border-radius:10px}
input:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--box)}
button{width:100%;min-height:44px;margin-top:24px;border:0;border-radius:10px;background:var(--accent);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.92}button:active{opacity:.8}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[role=alert]{margin:16px 0 0;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--error) 10%,transparent);color:var(--error);font-size:14px}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:12px}
