name: biofolio
services:
  library:
    build: .
    image: biofolio:local
    container_name: biofolio
    user: "${LIBRARY_UID:-1000}:${LIBRARY_GID:-10}"
    ports:
      - "18765:18765"
    volumes:
      - ./data:/data
      # 可选：若自行打包了含私有初始样卷的 library.html，可取消下一行注释挂载覆盖内置空库页面
      # - ./private:/private:ro
    environment:
      BIOLOGY_AI_ENDPOINT: "${BIOLOGY_AI_ENDPOINT:-}"
      BIOLOGY_AI_TIMEOUT: "${BIOLOGY_AI_TIMEOUT:-120}"
      BIOLOGY_LIBRARY_PASSWORD: "${BIOLOGY_LIBRARY_PASSWORD:?请在项目环境变量里设置独立登录密码}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
